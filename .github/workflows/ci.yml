name: CI

# Sulla PR solo se cambia config-api (filtro path); in merge queue gira sempre
# (merge_group non supporta i filtri path) sul commit che entrerà in main, quindi
# niente push su main: sarebbe un doppione.
on:
  pull_request:
    paths:
      - "config-api/**"
      - ".github/workflows/ci.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-config-api:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # La versione successiva (next) è informativa: dice quando è sicuro
    # aggiornare l'immagine base, ma un suo fallimento non blocca il gate
    # (con continue-on-error il workflow run resta success).
    continue-on-error: ${{ matrix.next }}
    strategy:
      fail-fast: false
      matrix:
        # Allineata all'immagine di produzione (config-api/Dockerfile:
        # python:3.14-slim) + versione successiva. Aggiornare insieme al FROM.
        include:
          - python-version: "3.14"
            next: false
          - python-version: "3.15"
            next: true

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            config-api/requirements.txt
            config-api/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r config-api/requirements-dev.txt

      - name: Run tests
        working-directory: config-api
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=55

  audit-config-api:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Run pip-audit
        run: pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes --disable-pip -r config-api/requirements-dev.txt

  # I test pytest girano su SQLite e non eseguono mai Alembic: un bump che rompe
  # le migrazioni su Postgres (es. SQLAlchemy 2.1 → driver di default psycopg v3,
  # non installato) passava verde. Qui: immagine reale + postgres:18 + stesso
  # command del compose (alembic upgrade head && uvicorn) + /health.
  smoke-config-api-postgres:
    name: smoke (image + alembic su postgres)
    # Pesante: solo in merge queue (e dispatch). Sulla PR girano i controlli
    # leggeri; il commit che entra in main è comunque testato così com'è.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Postgres con la stessa immagine (tag + digest) di docker-compose.yaml,
      # letta dal compose: dependabot aggiorna solo il compose e la CI lo segue
      # senza un secondo digest da tenere allineato.
      - name: Start postgres (immagine del compose)
        run: |
          set -euo pipefail
          img="$(grep -oE 'postgres:[0-9]+@sha256:[0-9a-f]{64}' docker-compose.yaml | head -n1)"
          [ -n "$img" ] || { echo "::error::immagine postgres con digest non trovata in docker-compose.yaml"; exit 1; }
          echo "postgres: $img"
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=proxy -e POSTGRES_PASSWORD=ci-password -e POSTGRES_DB=proxy "$img"
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U proxy -d proxy && exit 0
            sleep 2
          done
          echo "::error::postgres non pronto"; docker logs postgres; exit 1

      - name: Build config-api image
        run: docker build -t config-api:ci config-api

      - name: Start config-api (alembic upgrade head + uvicorn)
        run: |
          mkdir -p "$RUNNER_TEMP/satosa-conf"
          chmod 777 "$RUNNER_TEMP/satosa-conf"
          docker run -d --name config-api --network host \
            -e DATABASE_URL=postgresql+asyncpg://proxy:ci-password@127.0.0.1:5432/proxy \
            -e ADMIN_USER=admin -e ADMIN_PASSWORD=ci-admin-password \
            -e SESSION_SECRET=ci-session-secret-0123456789abcdef \
            -e ADMIN_2FA_ENABLED=true \
            -e PROXY_HOSTNAME=ci.example.invalid \
            -e SATOSA_CONF_DIR=/satosa-conf \
            -e SATOSA_HASH_SALT=ci-hash-salt-0123456789abcdef \
            -v "$RUNNER_TEMP/satosa-conf:/satosa-conf" \
            config-api:ci \
            sh -c "alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8000"

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' config-api)" != "true" ]; then
              echo "::error::config-api container exited"; docker logs config-api; exit 1
            fi
            sleep 2
          done
          echo "::error::config-api /health timeout"; docker logs config-api; exit 1

      - name: Alembic idempotente (secondo upgrade = no-op)
        run: docker exec config-api sh -c "alembic upgrade head && alembic current" | tee /dev/stderr | grep -q "(head)"

      - name: Logs config-api
        if: always()
        run: docker logs config-api || true

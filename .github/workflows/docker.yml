name: Docker Publish

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
    paths:
      - "satosa/**"
      - "config-api/**"
      - "nginx/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "satosa/**"
      - "config-api/**"
      - "nginx/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: pa-sso-proxy
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: satosa
            context: ./satosa
            scope: satosa
            # Dipendenze Python nel venv del fork upstream (iam-proxy-italia
            # v3.3, ultima release disponibile) portano vulnerabilita' HIGH
            # non ancora patchate a monte - blocchiamo solo su CRITICAL per
            # non tenere l'immagine rossa in permanenza per un problema che
            # non controlliamo. Gli HIGH restano visibili nel log dello scan.
            trivy-severity: "CRITICAL"
          - image: config-api
            context: ./config-api
            scope: config-api
            trivy-severity: "CRITICAL,HIGH"
          - image: nginx
            context: ./nginx
            scope: nginx
            trivy-severity: "CRITICAL,HIGH"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Compute app version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Write version file
        run: |
          if [ "${{ matrix.image }}" = "config-api" ]; then
            echo "${{ steps.version.outputs.value }}" > config-api/app_version.txt
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: First image tag
        id: first-tag
        run: |
          first_tag="$(head -n1 <<< "${{ steps.meta.outputs.tags }}")"
          echo "tag=${first_tag}" >> "$GITHUB_OUTPUT"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.first-tag.outputs.tag }}
          format: table
          exit-code: "1"
          severity: ${{ matrix.trivy-severity }}
          ignore-unfixed: true

name: Docker build

# Verifica delle immagini in merge queue: build + smoke + Trivy, SENZA push.
# Un'immagine che non si costruisce o non passa Trivy non entra in main.
# La pubblicazione su GHCR la fa solo release.yml (push per digest, firma,
# smoke dello stack, poi tag).

on:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: satosa
            # Dipendenze Python nel venv del fork upstream (iam-proxy-italia)
            # portano vulnerabilita' HIGH non ancora patchate a monte - soglia
            # assoluta solo CRITICAL per non tenere l'immagine rossa in
            # permanenza per un problema che non controlliamo. Le regressioni
            # HIGH le blocca lo step differenziale rispetto a :latest.
            trivy-severity: "CRITICAL"
            # Smoke: i backend si importano con il venv effettivo dell'immagine.
            smoke: >-
              docker run --rm --entrypoint sh "$IMAGE" -c
              'cd /satosa_proxy && PYTHONPATH=/satosa_proxy /.venv/bin/python -W ignore -c
              "import satosa.proxy_server, satosa.frontends.openid_connect, backends.spidsaml2, backends.cieoidc.cieoidc"'
          - image: config-api
            trivy-severity: "CRITICAL,HIGH"
            smoke: >-
              docker run --rm -e DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:5432/db
              "$IMAGE" python -c "import app.main"
          - image: nginx
            trivy-severity: "CRITICAL,HIGH"
            # L'entrypoint ufficiale elabora il template (resolver) prima di nginx -t.
            smoke: docker run --rm "$IMAGE" nginx -t

    env:
      IMAGE: pa-sso-proxy-${{ matrix.image }}:ci
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            deb.debian.org:443
            deb.debian.org:80
            dl-cdn.alpinelinux.org:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            files.pythonhosted.org:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Package refresh date
        id: refresh
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.image }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            PKG_REFRESH=${{ steps.refresh.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true

      - name: Smoke test
        run: ${{ matrix.smoke }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          severity: ${{ matrix.trivy-severity }}
          ignore-unfixed: true
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml

      # Stesso controllo differenziale di release.yml: una HIGH/CRITICAL con
      # fix assente in :latest (la produzione) blocca il merge, invece di
      # fermare la release dopo il tag (successo con v0.10.0: tag protetto
      # rimasto senza immagini). trivy è su PATH dallo step precedente.
      - name: Trivy differenziale vs :latest
        env:
          OLD: ghcr.io/provincia-di-pescara/pa-sso-proxy-${{ matrix.image }}:latest
          NAME: ${{ matrix.image }}
          TRIVY_IGNOREFILE: .trivyignore.yaml
        run: scripts/trivy-diff.sh "$IMAGE" "$OLD" "$NAME"

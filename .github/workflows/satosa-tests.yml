name: SATOSA plugin tests

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "satosa/**"
      - ".github/workflows/satosa-tests.yml"
  pull_request:
    paths:
      - "satosa/**"
      - ".github/workflows/satosa-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satosa-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-satosa-plugins:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: satosa/tests/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r satosa/tests/requirements-test.txt

      - name: Run tests
        working-directory: satosa/tests
        run: pytest -q

name: SATOSA plugin tests

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "satosa/**"
      - ".github/workflows/satosa-tests.yml"
  pull_request:
    paths:
      - "satosa/**"
      - ".github/workflows/satosa-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satosa-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-satosa-plugins:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: satosa/tests/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r satosa/tests/requirements-test.txt

      - name: Run tests
        working-directory: satosa/tests
        run: pytest -q test_redis_storage.py

  audit-satosa-tests:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run pip-audit
        run: pipx run pip-audit -r satosa/tests/requirements-test.txt

  test-satosa-plugins-docker:
    name: pytest inside satosa image (CIE OIDC / SPID SAML)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build satosa image
        uses: docker/build-push-action@v7
        with:
          context: ./satosa
          file: ./satosa/Dockerfile
          tags: satosa-test:latest
          load: true
          cache-from: type=gha,scope=satosa-test
          cache-to: type=gha,mode=max,scope=satosa-test

      - name: Run tests inside container
        run: |
          docker run --rm -v "$PWD/satosa/tests:/tests" --entrypoint sh satosa-test -c \
            ". /.venv/bin/activate && \
             pip install -q -r /tests/requirements-test.txt && \
             cd /satosa_proxy && \
             PYTHONPATH=/satosa_proxy pytest /tests -q --ignore=/tests/test_redis_storage.py"

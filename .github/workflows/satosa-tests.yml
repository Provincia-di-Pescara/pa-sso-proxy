name: SATOSA plugin tests

# Come ci.yml: PR filtrata per path, merge queue sempre, niente push su main.
on:
  pull_request:
    paths:
      - "satosa/**"
      - ".github/workflows/satosa-tests.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satosa-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-satosa-plugins:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: satosa/tests/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r satosa/tests/requirements-test.txt

      - name: Run tests
        working-directory: satosa/tests
        run: pytest -q test_redis_storage.py test_i18n.py test_i18n_fuzz.py test_i18n_catalog.py

  audit-satosa-tests:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Run pip-audit
        run: |
          pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes --disable-pip -r satosa/tests/requirements-test.txt
          pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes --disable-pip -r satosa/requirements-runtime.txt

  test-satosa-plugins-docker:
    name: pytest inside satosa image (CIE OIDC / SPID SAML)
    # Pesante: solo in merge queue (e dispatch). Sulla PR girano i controlli
    # leggeri; il commit che entra in main è comunque testato così com'è.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            deb.debian.org:443
            deb.debian.org:80
            dl-cdn.alpinelinux.org:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build satosa image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./satosa
          file: ./satosa/Dockerfile
          tags: satosa-test:latest
          load: true
          cache-from: type=gha,scope=satosa-test
          cache-to: type=gha,mode=max,scope=satosa-test,ignore-error=true

      - name: Run tests inside container
        # --user 0: l'immagine gira come uid 10001, ma qui si installano i
        # requirement dei test nel venv (di root). pip non è nell'immagine
        # (vedi satosa/Dockerfile): ensurepip lo reinstalla dalla wheel di sistema.
        run: |
          docker run --rm --user 0 -v "$PWD/satosa/tests:/tests" --entrypoint sh satosa-test -c \
            ". /.venv/bin/activate && \
             python -m ensurepip > /dev/null && \
             python -m pip install -q --require-hashes -r /tests/requirements-test.txt && \
             cd /satosa_proxy && \
             PYTHONPATH=/satosa_proxy pytest /tests -q --ignore=/tests/test_redis_storage.py"

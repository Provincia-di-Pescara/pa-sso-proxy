name: Security

# Controlli di sicurezza sul repository (non sulle immagini: quelle le scansiona
# docker.yml). Girano su ogni PR (niente filtro path: un segreto o una
# misconfigurazione possono stare ovunque), in merge queue, su main e ogni
# giorno (le CVE nuove escono anche senza commit).
#   dependency-review  solo PR: blocca dipendenze nuove HIGH+ (pip, Actions)
#   trivy-fs           vulnerabilità nei lock, segreti, misconfig Dockerfile
#   autofix-tests      test di scripts/security/pip_fix.py (fixture fisse)
# Eccezioni: .trivyignore.yaml (per ID e percorso, con motivazione).

on:
  pull_request:
  merge_group:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    # Confronta base e testa della PR: in coda e su main non ha senso (job
    # saltato = verde per il gate).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Anche le dipendenze di sviluppo/test e le Actions.
          fail-on-scopes: runtime, development, unknown

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            check.trivy.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Trivy fs (vuln, secret, misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # fixture dei test autofix: lock finti, non dipendenze reali
          skip-dirs: .git,scripts/security/test/fixtures
          format: table
          exit-code: "1"
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml

  autofix-tests:
    name: test script di sicurezza
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      # Test su copie fisse (scripts/security/test/fixtures), nessuna rete.
      - name: Unit test pip_fix.py
        run: python -m unittest discover -s scripts/security/test -v

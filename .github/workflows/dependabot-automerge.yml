name: Dependabot auto-merge

# Abilita l'auto-merge sulle PR dependabot patch/minor: con "CI gate" verde la
# PR entra in merge queue, dove ci-gate.yml rigira tutti i controlli (test,
# build, smoke, Trivy) sul commit che entrerà in main. Le librerie di
# firma/identità SPID e CIE e
# l'immagine base iam-proxy-italia restano manuali: la PR riceve l'etichetta
# "revisione-manuale" e un commento con il motivo.
#
# L'auto-merge è attivato con il token della GitHub App pa-sso-proxy-bot, non
# con GITHUB_TOKEN (le azioni fatte con GITHUB_TOKEN non avviano workflow).
# Il merge su main lo esegue poi la merge queue. Secret APP_CLIENT_ID/APP_PRIVATE_KEY
# vanno salvati anche tra i secret Dependabot: i workflow avviati da una PR
# dependabot vedono solo quelli.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Il merge lo fa il token dell'App; GITHUB_TOKEN serve solo per label e commento.
    permissions:
      contents: read
      pull-requests: write
      # gh label create: le label sono risorse "issues".
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # La decisione si basa sui metadati dichiarati da dependabot: vale solo se la
      # PR contiene esclusivamente commit di dependabot (verificati) e file
      # dell'ecosistema aggiornato. Un commit aggiunto a mano al branch (anche da
      # chi ha accesso in scrittura) o un file inatteso → revisione manuale.
      - name: Check PR content
        id: content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          foreign="$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | select(.author.login != "dependabot[bot]" or .commit.verification.verified != true) | .sha')"
          case "$ECOSYSTEM" in
            pip) allowed='(^|/)requirements[^/]*\.(in|txt)$' ;;
            docker) allowed='(^|/)Dockerfile[^/]*$' ;;
            docker_compose|docker-compose) allowed='(^|/)docker-compose[^/]*\.ya?ml$' ;;
            github_actions|github-actions) allowed='^\.github/(workflows/[^/]+\.ya?ml|actions/.+/action\.ya?ml)$' ;;
            *) allowed='^$' ;;
          esac
          unexpected="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -vE "$allowed" || true)"
          problem=""
          if [ -n "$foreign" ]; then problem="commit non di dependabot o non verificati: $(echo $foreign)"; fi
          if [ -n "$unexpected" ]; then problem="${problem:+$problem; }file fuori dall'ecosistema $ECOSYSTEM: $(echo $unexpected)"; fi
          echo "problem=${problem:-none}"
          echo "problem=$problem" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          PROBLEM: ${{ steps.content.outputs.problem }}
        run: |
          # Dipendenze che toccano firma SAML/JWT o il core SPID/CIE.
          manual_re='(^|[ ,])(pysaml2|cryptojwt|cryptography|pyeudiw|satosa|ghcr\.io/italia/iam-proxy-italia|italia/iam-proxy-italia)([ ,]|$)'
          reason=""
          if [ -n "$PROBLEM" ]; then
            reason="PR modificata fuori da dependabot ($PROBLEM)"
          elif printf '%s' "$DEPS" | grep -qiE "$manual_re"; then
            reason="dipendenza SPID/CIE o immagine base iam-proxy-italia"
          elif [ "$ECOSYSTEM" = "docker" ] && printf '%s' "$DEPS" | grep -qiE '(^|[ ,])(library/)?python([ ,]|$)'; then
            # python:3.14-slim → 3.15-slim è "minor" per semver, ma cambia
            # l'interprete (wheel, ABI): va trattato come una major. Prima di
            # mergiare, il job pytest della versione "next" in ci.yml deve essere verde.
            reason="cambio versione Python dell'immagine base"
          elif [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            reason="aggiornamento major"
          elif [ -z "$UPDATE_TYPE" ]; then
            reason="tipo di aggiornamento non determinato"
          fi
          echo "deps=$DEPS type=$UPDATE_TYPE reason=${reason:-auto}"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          # Le PR alterate vanno segnalate anche su synchronize (è lì che succede).
          [ -n "$PROBLEM" ] && echo "tampered=true" >> "$GITHUB_OUTPUT" || true

      - name: GitHub App token
        id: app-token
        if: steps.decide.outputs.reason == ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Solo i permessi che servono, non tutti quelli dell'App. Workflows
          # solo per i bump delle Action (PR che toccano .github/workflows/).
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ steps.meta.outputs.package-ecosystem == 'github_actions' && 'write' || '' }}

      - name: Enable auto-merge
        if: steps.decide.outputs.reason == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Con la merge queue --auto accoda la PR quando i check sono verdi;
        # il metodo (squash) lo impone la coda.
        run: gh pr merge --auto "$PR_URL"

      # Auto-merge attivato su un push precedente: va tolto se ora la PR non è
      # più idonea (es. commit aggiunto al branch dopo l'apertura).
      - name: Disable auto-merge
        if: steps.decide.outputs.reason != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --disable-auto "$PR_URL" 2>/dev/null || true

      - name: Flag for manual review
        if: steps.decide.outputs.reason != '' && (github.event.action != 'synchronize' || steps.decide.outputs.tampered == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          gh label create revisione-manuale --color D93F0B \
            --description "PR dependabot esclusa dall'auto-merge" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label revisione-manuale
          gh pr comment "$PR_URL" --body "Auto-merge non applicato: **${REASON}**. Serve una revisione manuale prima del merge."

version: 2
# Giornaliero alle 01:00 (il cooldown resta: le versioni nuove entrano dopo 7
# giorni; gli advisory di sicurezza arrivano subito dai security updates).
# Lock pip: dependabot aggiorna il .in e rigenera il .txt con hash (pip-compile).
# Patch/minor: raggruppate e mergiate da dependabot-automerge.yml dopo il CI gate.
# Major: PR singola, mai raggruppata (update-types), lasciata aperta con label
# "revisione-manuale" come promemoria. Limite PR alzato a 10 perché le major
# aperte non blocchino l'arrivo di nuove PR (default 5 per directory).
updates:
  - package-ecosystem: "pip"
    directory: "/config-api"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
        # Esclusa dall'auto-merge (firma/cifratura): PR separata, così non
        # blocca il resto del gruppo in revisione manuale.
        exclude-patterns:
          - "cryptography"

  # satosa/requirements-runtime.txt: pacchetti aggiunti al venv dell'immagine upstream.
  - package-ecosystem: "pip"
    directory: "/satosa"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-runtime-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/satosa/tests"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-test-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Immagini in docker-compose.yaml (postgres, redis). Major PostgreSQL = migrazione
  # dati (docs/deployment.md), non un semplice bump del tag:
  # ignorate (la migrazione si fa a mano, vedi CLAUDE.md "PostgreSQL 18").
  - package-ecosystem: "docker-compose"
    directory: "/"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/config-api"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/satosa"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/nginx"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

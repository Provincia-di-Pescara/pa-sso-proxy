# Header di sicurezza comuni, inclusi in OGNI location che risponde al client:
# in nginx un add_header dentro una location annulla quelli ereditati dal
# server, quindi niente add_header a livello server.
# HSTS: i browser lo ignorano su HTTP (sviluppo locale); in produzione la
# risposta arriva in HTTPS dal reverse proxy. Niente includeSubDomains: non
# deve toccare gli altri sottodomini dell'ente.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
